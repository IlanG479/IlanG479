<svg xmlns="http://www.w3.org/2000/svg" width="840" height="268" viewBox="0 0 840 268" role="img" aria-label="Terminal boot log listing Ilan's projects: lilota, vibecraft, claude-os, ratio">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11161f"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .dim  { fill: #55627a; }
      .name { fill: #e6edf3; }
      .desc { fill: #8b98ad; }
      .ok   { fill: #3fb950; }
      .cy   { fill: #22d3ee; }
      .bl   { fill: #3b82f6; }
      .lead { stroke: #2f3a4d; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="840" height="268" rx="12" fill="url(#panel)"/>
  <rect x="0.5" y="0.5" width="839" height="267" rx="12" fill="none" stroke="#222b39"/>

  <circle cx="22" cy="22" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="22" r="5.5" fill="#febc2e"/>
  <circle cx="58" cy="22" r="5.5" fill="#28c840"/>
  <text class="m dim" x="418" y="26" font-size="11.5" text-anchor="middle">ilan@build — zsh</text>
  <line x1="0" y1="44" x2="840" y2="44" stroke="#222b39"/>

  <g class="m" font-size="13.5">
    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.08;0.14" dur="5s" fill="freeze"/>
      <text x="24" y="76" class="cy">$</text>
      <text x="42" y="76" class="name">ilan --status</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.24;0.30" dur="5s" fill="freeze"/>
      <text x="24" y="105" class="bl">▸</text>
      <text x="44" y="105" class="name">lilota</text>
      <line class="lead" x1="102" y1="101" x2="164" y2="101"/>
      <text x="174" y="105" class="desc">esp32 ulp · deep-sleep · rtc</text>
      <text x="470" y="105" class="ok">[ok]</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.36;0.42" dur="5s" fill="freeze"/>
      <text x="24" y="132" class="bl">▸</text>
      <text x="44" y="132" class="name">vibecraft</text>
      <line class="lead" x1="126" y1="128" x2="164" y2="128"/>
      <text x="174" y="132" class="desc">rust · wgpu renderer</text>
      <text x="470" y="132" class="ok">[ok]</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.48;0.54" dur="5s" fill="freeze"/>
      <text x="24" y="159" class="bl">▸</text>
      <text x="44" y="159" class="name">claude-os</text>
      <line class="lead" x1="126" y1="155" x2="164" y2="155"/>
      <text x="174" y="159" class="desc">react · three.js · local-first</text>
      <text x="470" y="159" class="ok">[ok]</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.60;0.66" dur="5s" fill="freeze"/>
      <text x="24" y="186" class="bl">▸</text>
      <text x="44" y="186" class="name">ratio</text>
      <line class="lead" x1="94" y1="182" x2="164" y2="182"/>
      <text x="174" y="186" class="desc">chrome side panel · no server</text>
      <text x="470" y="186" class="ok">[ok]</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.74;0.80" dur="5s" fill="freeze"/>
      <rect x="24" y="205" width="330" height="1.5" fill="url(#rule)"/>
      <text x="24" y="234" class="dim">build log</text>
      <text x="108" y="234" class="name">2025 → 2026</text>
      <text x="212" y="234" class="cy">still compiling</text>
    </g>

    <rect x="344" y="223" width="8" height="14" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.35;0.4;0.9;1" dur="1.1s" begin="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
